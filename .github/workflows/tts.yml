name: voz-ximena
on:
  push:
    paths: ['tts/*.txt']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: voz, cancel-in-progress: false }
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install azure-cognitiveservices-speech
      - name: Generar audios pendientes
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          for f in tts/*.txt; do [ -f "${f%.txt}.wav" ] || python scripts/tts.py "$f"; done
      - name: Guardar resultado
        run: |
          git config user.name "voz-bot"; git config user.email "actions@users.noreply.github.com"
          git add tts/ && (git diff --cached --quiet || (git commit -m "Voz generada [skip ci]" && git pull --rebase && git push))
