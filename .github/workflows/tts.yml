name: voz-ximena
on:
  push:
    paths: ['tts/*.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install edge-tts==7.0.2
      - name: Generar audios pendientes
        run: |
          for f in tts/*.txt; do [ -f "${f%.txt}.mp3" ] || python scripts/tts.py "$f"; done
      - name: Guardar resultado
        run: |
          git config user.name "voz-bot"; git config user.email "actions@users.noreply.github.com"
          git add tts/ && (git diff --cached --quiet || (git commit -m "Voz generada [skip ci]" && git push))
